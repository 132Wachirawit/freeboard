<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Greenhouse Dashboard</title>
    <!-- โหลด Tailwind CSS สำหรับตกแต่งความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Chart.js สำหรับสร้างกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- โหลด Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- ส่วนหัวของ Dashboard -->
        <header class="bg-emerald-600 text-white p-6 rounded-2xl shadow-lg mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold">🌱 Smart Greenhouse IoT</h1>
                <p class="text-emerald-100 mt-2 text-sm md:text-base">ระบบติดตามโรงเรือนอัจฉริยะแบบ Real-time</p>
            </div>
            <div id="status" class="px-4 py-2 bg-emerald-700 rounded-full text-sm font-semibold animate-pulse border border-emerald-500">
                กำลังเชื่อมต่อฐานข้อมูล...
            </div>
        </header>

        <!-- Widget แสดงค่าปัจจุบัน (Latest) -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-red-500 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">อุณหภูมิ (Temp)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-temp">-- <span class="text-lg text-slate-400">°C</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-blue-500 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">ความชื้นอากาศ (Humi)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-hum">-- <span class="text-lg text-slate-400">%</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-yellow-400 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">แสงสว่าง (Light)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-light">-- <span class="text-lg text-slate-400">lx</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-orange-700 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">ความชื้นดิน (Soil)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-soil">-- <span class="text-lg text-slate-400">%</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-gray-500 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">คาร์บอนไดออกไซด์ (CO2)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-co2">-- <span class="text-lg text-slate-400">ppm</span></p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-4 border-cyan-400 flex flex-col justify-between">
                <h3 class="text-slate-500 font-medium text-sm md:text-base">ระดับน้ำ (Water)</h3>
                <p class="text-3xl md:text-4xl font-bold text-slate-800 mt-2" id="val-water">-- <span class="text-lg text-slate-400">%</span></p>
            </div>
        </div>

        <!-- กราฟแสดงประวัติ (History) -->
        <div class="bg-white p-6 rounded-2xl shadow">
            <h3 class="text-xl font-bold text-slate-700 mb-4">แนวโน้มอุณหภูมิและความชื้น (15 ค่าล่าสุด)</h3>
            <div class="relative h-64 md:h-80">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. ตั้งค่าเชื่อมต่อ Firebase (ใช้ URL ของคุณและไม่มี .json ต่อท้าย)
        const firebaseConfig = {
            databaseURL: "https://iot-132-default-rtdb.asia-southeast1.firebasedatabase.app/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. ตั้งค่าการแสดงผลกราฟ Chart.js
        const ctx = document.getElementById('historyChart').getContext('2d');
        const historyChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    { 
                        label: 'อุณหภูมิ (°C)', 
                        borderColor: '#ef4444', 
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        data: [], 
                        tension: 0.4,
                        fill: true
                    },
                    { 
                        label: 'ความชื้น (%)', 
                        borderColor: '#3b82f6', 
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        data: [], 
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });

        // 3. ดึงข้อมูลจากโหนด /lab/esp32-01/latest เพื่อแสดงตัวเลข
        db.ref('lab/esp32-01/latest').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                // อัปเดตสถานะการเชื่อมต่อ
                const statusEl = document.getElementById('status');
                statusEl.innerHTML = '🟢 ออนไลน์ (ข้อมูลล่าสุด)';
                statusEl.className = 'px-4 py-2 bg-emerald-100 text-emerald-800 rounded-full text-sm font-bold border border-emerald-200 shadow-sm';
                
                // อัปเดตตัวเลขเซนเซอร์
                document.getElementById('val-temp').innerHTML = `${data.temp ? data.temp.toFixed(1) : '--'} <span class="text-lg text-slate-400">°C</span>`;
                document.getElementById('val-hum').innerHTML = `${data.hum ? data.hum.toFixed(1) : '--'} <span class="text-lg text-slate-400">%</span>`;
                document.getElementById('val-light').innerHTML = `${data.light ? Math.round(data.light) : '--'} <span class="text-lg text-slate-400">lx</span>`;
                document.getElementById('val-soil').innerHTML = `${data.soil ? data.soil.toFixed(1) : '--'} <span class="text-lg text-slate-400">%</span>`;
                document.getElementById('val-co2').innerHTML = `${data.co2 ? Math.round(data.co2) : '--'} <span class="text-lg text-slate-400">ppm</span>`;
                document.getElementById('val-water').innerHTML = `${data.water ? data.water.toFixed(1) : '--'} <span class="text-lg text-slate-400">%</span>`;
            }
        });

        // 4. ดึงข้อมูลจากโหนด /lab/esp32-01/history เพื่อวาดกราฟ
        db.ref('lab/esp32-01/history').limitToLast(15).on('value', (snapshot) => {
            const labels = [], temp = [], hum = [];
            
            snapshot.forEach((child) => {
                const data = child.val();
                if(data.timestamp) {
                    // แปลง Unix Timestamp เป็นเวลาที่อ่านได้
                    const date = new Date(data.timestamp * 1000); 
                    const timeString = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
                    
                    labels.push(timeString);
                    temp.push(data.temp);
                    hum.push(data.hum);
                }
            });
            
            // อัปเดตข้อมูลในกราฟ
            historyChart.data.labels = labels;
            historyChart.data.datasets[0].data = temp;
            historyChart.data.datasets[1].data = hum;
            historyChart.update();
        });
    </script>
</body>
</html>
